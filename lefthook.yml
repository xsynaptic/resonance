# Git hooks; `pnpm install` syncs them into .git/hooks via lefthook's postinstall
pre-push:
  jobs:
    - name: quality-gate
      run: pnpm check

check:
  piped: true
  jobs:
    - name: astro
      run: astro check
    - name: verify
      group:
        parallel: true
        jobs:
          - name: css
            run: stylelint "{src,packages/player}/**/*.{css,astro}" --cache --cache-location node_modules/.cache/stylelint/
          - name: format
            run: prettier --check . --cache --log-level warn
          - name: js
            run: eslint --cache --cache-location node_modules/.cache/eslint/
          - name: worker
            group:
              piped: true
              jobs:
                - name: types
                  run: wrangler types --check
                - name: tsc
                  run: tsc --noEmit -p worker
          - name: unused
            run: knip
          # Dead code stays with knip, which already encodes fallow's false positives
          - name: dupes
            run: fallow dupes --quiet
          # Health prints its report even at zero findings, so output shows only on failure
          - name: complexity
            run: out=$(fallow health --complexity --quiet 2>&1) || { printf '%s\n' "$out"; exit 1; }
          - name: boundaries
            run: fallow dead-code --boundary-violations --quiet
          - name: test
            run: vitest run

fix:
  piped: true
  jobs:
    - name: autofix
      group:
        piped: true
        jobs:
          - name: css
            run: stylelint "{src,packages/player}/**/*.{css,astro}" --fix --cache --cache-location node_modules/.cache/stylelint/
          - name: format
            run: prettier --write . --cache --list-different
          - name: js
            run: eslint --fix --cache --cache-location node_modules/.cache/eslint/
    - name: astro
      run: astro check
    - name: worker
      group:
        piped: true
        jobs:
          - name: types
            run: wrangler types
          - name: tsc
            run: tsc --noEmit -p worker
    - name: unused
      run: knip
    - name: dupes
      run: fallow dupes --quiet
    - name: complexity
      run: out=$(fallow health --complexity --quiet 2>&1) || { printf '%s\n' "$out"; exit 1; }
    - name: boundaries
      run: fallow dead-code --boundary-violations --quiet
