<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1" name="viewport" />
		<title>Player end-to-end page</title>
		<script src="./host.ts" type="module"></script>
	</head>
	<body>
		<main>
			<div data-track-id="long">
				<button data-play-track="long" type="button">Play long</button>
				<button data-queue-track="long" type="button">Queue long</button>
			</div>
			<div data-track-id="short">
				<button data-play-track="short" type="button">Play short</button>
				<button data-queue-track="short" type="button">Queue short</button>
			</div>
		</main>
		<div data-player-host style="position: fixed; inset: auto 0 0"></div>
	</body>
</html>
