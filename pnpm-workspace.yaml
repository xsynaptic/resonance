packages:
  - packages/*

# Mitigate supply-chain attacks by requiring packages to be at least 24h old
minimumReleaseAge: 1440
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - astro
  - '@astrojs/*'
  - '@xsynaptic/*'

# TypeScript 7 native binaries for fallow's type-aware mode, which this project does not use
ignoredOptionalDependencies:
  - fallow-type-aware

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y caps its eslint peer at ^9 but uses no APIs removed in ESLint 10
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

permissions:
  fallow:
    skills: false
