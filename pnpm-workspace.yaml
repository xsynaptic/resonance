packages:
  - packages/**

# Mitigate supply-chain attacks by requiring packages to be at least 24h old
minimumReleaseAge: 1440
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - astro
  - '@astrojs/*'
  - '@xsynaptic/*'

peerDependencyRules:
  allowedVersions:
    # astro-pagefind@2.0.0 caps its astro peer at ^6; the integration works on 7
    'astro-pagefind>astro': '7'
    # eslint-plugin-jsx-a11y caps its eslint peer at ^9 but uses no APIs removed in ESLint 10
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
