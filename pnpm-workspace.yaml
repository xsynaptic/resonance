packages:
  - packages/*

# Mitigate supply-chain attacks by requiring packages to be at least 48h old
minimumReleaseAge: 2880
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - astro
  - '@astrojs/*'
  - '@xsynaptic/*'

# TypeScript 7 native binaries for fallow's type-aware mode, which this project does not use
# Removal override because pnpm 12.3.4 still installs packages listed in ignoredOptionalDependencies
overrides:
  fallow-type-aware: '-'

peerDependencyRules:
  allowedVersions:
    # astro-pagefind@2.0.0 caps its astro peer at ^6; the integration works on 7
    'astro-pagefind>astro': '7'
    # eslint-plugin-jsx-a11y caps its eslint peer at ^9 but uses no APIs removed in ESLint 10
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
